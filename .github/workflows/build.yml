name: Build macOS app

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)create, e.g. v2.1.1. Leave blank to use v<MARKETING_VERSION>."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: macos-15
    env:
      SCHEME_TARGET: Auto Reload
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project AutoReload.xcodeproj \
            -target "$SCHEME_TARGET" \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/Intermediates" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Verify bundle
        run: |
          APP="build/Release/Auto Reload.app"
          ls -la "$APP/Contents/PlugIns"
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Package .app.zip
        id: package
        run: |
          APP="build/Release/Auto Reload.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          ZIP="Auto-Reload-${VERSION}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          TAG="${INPUT_TAG:-v$VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Release $TAG exists; replacing its asset."
              gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Release $TAG already exists; skipping (use workflow_dispatch to replace the asset)."
            fi
            exit 0
          fi
          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Auto Reload $TAG" \
            --notes-file .github/release-notes.md
